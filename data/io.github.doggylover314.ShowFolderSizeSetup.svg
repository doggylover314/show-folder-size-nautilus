<?xml version="1.0" encoding="UTF-8"?>
<!-- Folder Size Setup icon: a folder with a fill gauge, drawn to read at
     32px as well as at full size. Flat shapes only, no gradients, so it
     stays legible under both light and dark shell themes. -->
