     viewBox="0 0 128 128">
  <rect x="12" y="30" width="104" height="76" rx="10" fill="#3584e4"/>
  <path d="M12 40 v-6 a10 10 0 0 1 10-10 h26 l10 12 h48 a10 10 0 0 1 10 10 v4 z"
        fill="#1c71d8"/>
  <rect x="26" y="58" width="76" height="14" rx="7" fill="#ffffff"
        opacity="0.35"/>
  <rect x="26" y="58" width="50" height="14" rx="7" fill="#ffffff"/>
  <rect x="26" y="82" width="76" height="10" rx="5" fill="#ffffff"
        opacity="0.35"/>
  <rect x="26" y="82" width="30" height="10" rx="5" fill="#ffffff"/>
</svg>
