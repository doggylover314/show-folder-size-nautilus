# Release: runs when show_folder_size.py (where __version__ lives) changes on
# main, or by hand from the Actions tab.
#
# For a version with no release yet, it builds the .deb and .rpm, signs the
# .rpm, tags the commit and creates the GitHub release. Both packages carry
# the repository definition and public key, so anyone who installs the
# downloaded file once gets later versions from `dnf upgrade`, `apt upgrade`
# and GNOME Software. It then publishes those signed repositories by pushing
# them to the gh-pages branch, which GitHub Pages serves.
#
# Releasing is therefore: bump __version__ (build-deb.sh and build-rpm.sh
# refuse to build until the metainfo and spec agree with it), push to main.
#
# The one requirement is a SIGNING_KEY secret, set once by the repository
# owner: an ASCII-armoured GPG private key with no passphrase. It has to stay
# the same key forever, because installed copies trust the key they shipped
# with. That is why it is a secret and never generated here. See "Publishing
# a release" in the README.

name: Release

on:
  push:
    branches: [main]
    paths:
      - show_folder_size.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write     # tag, release, and the gh-pages branch
  pages: write        # ask Pages to rebuild after the push

# Two pushes in quick succession must not race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' show_folder_size.py)"
          [ -n "$version" ] || { echo "::error::no __version__ in show_folder_size.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # First, because the packages are built with the public half inside
      # them. Without it a release would ship packages that cannot update
      # themselves, so it stops here instead.
      - name: Import the signing key
        id: key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::No SIGNING_KEY secret. Packages carry the public key so they can update themselves, so nothing is released without it. See 'Publishing a release' in the README."
            exit 1
          fi
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          gpg --armor --export "$fpr" > "$RUNNER_TEMP/repo-key.asc"
          echo "fpr=$fpr" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm createrepo-c apt-utils dpkg-dev gnupg \
            desktop-file-utils python3-gi gir1.2-pango-1.0 python3-gi-cairo \
            fonts-dejavu-core gir1.2-nautilus-4.0 gir1.2-gtk-3.0

      # The real libnautilus-extension builds from other releases, so the ABI
      # tests run instead of skipping. They come from the Ubuntu archive, which
      # drops old versions; a download failure there must not block a release.
      - name: Fetch ABI test fixtures
        run: tests/fetch-abi-fixtures.sh || echo "::warning::ABI fixtures unavailable; those tests will skip"

      - name: Tests
        run: tests/run-tests.sh

      - name: Create the release, or fetch the one that exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          FPR: ${{ steps.key.outputs.fpr }}
          REPO_KEY: ${{ runner.temp }}/repo-key.asc
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Already released. Publish exactly those files rather than a
            # rebuild that merely shares the version number: someone who
            # downloaded the .rpm and someone who got it from dnf should have
            # the same bytes.
            echo "$TAG already exists; publishing its files"
            mkdir -p dist
            gh release download "$TAG" --dir dist --pattern '*.rpm' --pattern '*.deb'
          else
            ./build-deb.sh
            ./build-rpm.sh
            # Signed here, before it is attached, so the download and the
            # copy in the dnf repository are one and the same file.
            rpmsign --define "_gpg_name $FPR" --addsign dist/*.rpm
            {
              awk -v v="$VERSION" '
                index($0, "## [" v "]") == 1 { on = 1; next }
                on && /^## \[/ { exit }
                on { print }' CHANGELOG.md
              echo "### Install"
              echo "- Fedora: download the \`.rpm\` below and open it, or \`sudo dnf install ./\` it."
              echo "- Debian/Ubuntu: download the \`.deb\` below and open it, or \`sudo apt install ./\` it."
              echo ""
              echo "Either way, later versions then arrive with your normal system updates."
            } > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
              --notes-file notes.md dist/*.deb dist/*.rpm
          fi
          ls -l dist

      - name: Build the repositories
        run: ./build-site.sh --key "${{ steps.key.outputs.fpr }}" --out site

      # Force-pushed as one fresh commit each time, so gh-pages never
      # accumulates a history of every package ever built.
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Package repositories for $TAG"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null ||
            echo "::warning::Could not request a Pages build; the push normally starts one."
